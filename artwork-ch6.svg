<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Chapter VI: Integration Mandala -->

  <!-- Outer circle -->
  <circle cx="300" cy="300" r="280" fill="none" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Sacred geometry base - concentric circles -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="#2F4F4F" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="300" r="200" fill="none" stroke="#2F4F4F" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#00CED1" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="120" fill="none" stroke="#00CED1" stroke-width="1" opacity="0.7"/>
  <circle cx="300" cy="300" r="80" fill="none" stroke="#FFB347" stroke-width="2"/>
  <circle cx="300" cy="300" r="40" fill="none" stroke="#1A1A1A" stroke-width="2"/>

  <!-- 8-pointed star pattern -->
  <g opacity="0.6" stroke="#2F4F4F" stroke-width="1">
    <line x1="300" y1="20" x2="300" y2="580"/>
    <line x1="20" y1="300" x2="580" y2="300"/>
    <line x1="90" y1="90" x2="510" y2="510"/>
    <line x1="510" y1="90" x2="90" y2="510"/>
  </g>

  <!-- Integration symbols at 8 points (representing all chapters) -->
  <!-- Top - Introduction -->
  <circle cx="300" cy="40" r="15" fill="none" stroke="#00CED1" stroke-width="2"/>
  <circle cx="300" cy="40" r="8" fill="#00CED1"/>

  <!-- Top-right - Chapter I (Permission) -->
  <polygon points="485,115 500,100 515,115 500,130" fill="none" stroke="#00CED1" stroke-width="2"/>
  <circle cx="500" cy="115" r="4" fill="#FFB347"/>

  <!-- Right - Chapter II (Technology) -->
  <rect x="545" y="285" width="30" height="30" fill="none" stroke="#00CED1" stroke-width="2"/>
  <line x1="552" y1="292" x2="568" y2="308" stroke="#FFB347" stroke-width="2"/>
  <line x1="568" y1="292" x2="552" y2="308" stroke="#FFB347" stroke-width="2"/>

  <!-- Bottom-right - Chapter III (Awakening) -->
  <path d="M 500,485 L 520,465 L 520,505 Z" fill="none" stroke="#00CED1" stroke-width="2"/>
  <circle cx="513" cy="485" r="5" fill="#FFB347"/>

  <!-- Bottom - Chapter IV (Transformation) -->
  <circle cx="300" cy="560" r="15" fill="none" stroke="#FFB347" stroke-width="2"/>
  <polygon points="300,550 310,560 300,570 290,560" fill="#FFB347"/>

  <!-- Bottom-left - Chapter V (Bridging) -->
  <rect x="80" y="470" width="40" height="10" fill="none" stroke="#00CED1" stroke-width="2"/>
  <rect x="80" y="485" width="40" height="10" fill="none" stroke="#00CED1" stroke-width="2"/>
  <rect x="80" y="500" width="40" height="10" fill="none" stroke="#00CED1" stroke-width="2"/>

  <!-- Left - Chapter VI (Integration) -->
  <circle cx="40" cy="300" r="15" fill="none" stroke="#FFB347" stroke-width="2"/>
  <circle cx="40" cy="300" r="10" fill="none" stroke="#00CED1" stroke-width="1.5"/>
  <circle cx="40" cy="300" r="5" fill="#1A1A1A"/>

  <!-- Top-left - Conclusion -->
  <polygon points="100,100 90,115 110,115" fill="none" stroke="#FFB347" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="120" stroke="#00CED1" stroke-width="1"/>

  <!-- Central consciousness figure -->
  <circle cx="300" cy="300" r="30" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Inner radiating lines (archetypal fluidity) -->
  <g opacity="0.5" stroke="#00CED1" stroke-width="0.8">
    <line x1="300" y1="270" x2="300" y2="220"/>
    <line x1="330" y1="300" x2="380" y2="300"/>
    <line x1="300" y1="330" x2="300" y2="380"/>
    <line x1="270" y1="300" x2="220" y2="300"/>
    <line x1="321" y1="279" x2="360" y2="240"/>
    <line x1="321" y1="321" x2="360" y2="360"/>
    <line x1="279" y1="321" x2="240" y2="360"/>
    <line x1="279" y1="279" x2="240" y2="240"/>
  </g>

  <!-- Connecting arcs between symbols -->
  <g opacity="0.3" fill="none" stroke="#2F4F4F" stroke-width="0.5">
    <path d="M 300,55 A 200,200 0 0,1 485,130"/>
    <path d="M 515,300 A 200,200 0 0,1 485,470"/>
    <path d="M 300,545 A 200,200 0 0,1 115,470"/>
    <path d="M 85,300 A 200,200 0 0,1 115,130"/>
  </g>

  <!-- Technical marks around perimeter -->
  <g stroke="#2F4F4F" stroke-width="0.5" opacity="0.3">
    <line x1="295" y1="15" x2="305" y2="15"/>
    <line x1="585" y1="295" x2="585" y2="305"/>
    <line x1="295" y1="585" x2="305" y2="585"/>
    <line x1="15" y1="295" x2="15" y2="305"/>
  </g>
</svg>
