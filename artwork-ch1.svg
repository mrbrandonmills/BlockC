<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Chapter I: Permission Breaking Through -->

  <!-- Background grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2F4F4F" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- Breaking barrier/membrane -->
  <ellipse cx="300" cy="300" rx="200" ry="150" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Shattered barrier pieces with cyan highlights -->
  <path d="M 300,150 L 350,120 L 370,140 L 320,170 Z" fill="none" stroke="#00CED1" stroke-width="2"/>
  <path d="M 500,300 L 530,280 L 540,310 L 510,330 Z" fill="none" stroke="#00CED1" stroke-width="2"/>
  <path d="M 300,450 L 330,480 L 310,500 L 280,470 Z" fill="none" stroke="#00CED1" stroke-width="2"/>
  <path d="M 100,300 L 70,320 L 60,290 L 90,270 Z" fill="none" stroke="#00CED1" stroke-width="2"/>

  <!-- Central figure breakthrough -->
  <circle cx="300" cy="300" r="50" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="300" cy="300" r="40" fill="none" stroke="#FFB347" stroke-width="2"/>

  <!-- Radiating energy lines -->
  <g opacity="0.6">
    <line x1="300" y1="300" x2="450" y2="150" stroke="#00CED1" stroke-width="2"/>
    <line x1="300" y1="300" x2="450" y2="450" stroke="#00CED1" stroke-width="2"/>
    <line x1="300" y1="300" x2="150" y2="150" stroke="#00CED1" stroke-width="2"/>
    <line x1="300" y1="300" x2="150" y2="450" stroke="#00CED1" stroke-width="2"/>
  </g>

  <!-- Crowd silhouettes at bottom (stadium moment) -->
  <g opacity="0.4" fill="#1A1A1A">
    <rect x="50" y="520" width="15" height="60" rx="2"/>
    <rect x="80" y="510" width="15" height="70" rx="2"/>
    <rect x="110" y="530" width="15" height="50" rx="2"/>
    <rect x="140" y="515" width="15" height="65" rx="2"/>
    <rect x="170" y="525" width="15" height="55" rx="2"/>
    <rect x="200" y="520" width="15" height="60" rx="2"/>
    <rect x="230" y="510" width="15" height="70" rx="2"/>
    <rect x="260" y="530" width="15" height="50" rx="2"/>
    <rect x="290" y="515" width="15" height="65" rx="2"/>
    <rect x="320" y="525" width="15" height="55" rx="2"/>
    <rect x="350" y="520" width="15" height="60" rx="2"/>
    <rect x="380" y="530" width="15" height="50" rx="2"/>
    <rect x="410" y="510" width="15" height="70" rx="2"/>
    <rect x="440" y="525" width="15" height="55" rx="2"/>
    <rect x="470" y="515" width="15" height="65" rx="2"/>
    <rect x="500" y="520" width="15" height="60" rx="2"/>
    <rect x="530" y="530" width="15" height="50" rx="2"/>
  </g>

  <!-- Wavefront pattern showing collective impact -->
  <g opacity="0.3">
    <circle cx="300" cy="300" r="100" fill="none" stroke="#00CED1" stroke-width="1"/>
    <circle cx="300" cy="300" r="130" fill="none" stroke="#00CED1" stroke-width="0.8"/>
    <circle cx="300" cy="300" r="160" fill="none" stroke="#00CED1" stroke-width="0.6"/>
    <circle cx="300" cy="300" r="190" fill="none" stroke="#00CED1" stroke-width="0.4"/>
  </g>

  <!-- Corner accents -->
  <circle cx="50" cy="50" r="5" fill="#FFB347"/>
  <circle cx="550" cy="50" r="5" fill="#FFB347"/>
  <circle cx="50" cy="550" r="5" fill="#FFB347"/>
  <circle cx="550" cy="550" r="5" fill="#FFB347"/>
</svg>
